name: Drawer v2

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  verify-compose:
    name: Compose tests and Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Grant Gradle wrapper permission
        run: chmod +x kotlin-core/gradlew
      - name: Test v2 and compile Android debug
        run: ./kotlin-core/gradlew -p compose check :storage-nio:test :android-app:assembleDebug --no-daemon --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-reports
          path: |
            compose/**/build/test-results/**
            compose/**/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

  verify-desktop:
    name: Windows desktop compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compile desktop client
        shell: pwsh
        run: .\kotlin-core\gradlew.bat -p compose :desktop-app:compileKotlin --no-daemon --console=plain

  release-android:
    name: Signed Android release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-compose, verify-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/drawer-release.jks"
      - name: Build signed Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/drawer-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./kotlin-core/gradlew -p compose :android-app:assembleRelease -PreleaseVersion=${GITHUB_REF_NAME#v} -PreleaseVersionCode=${GITHUB_RUN_NUMBER} --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: compose/android-app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release-windows:
    name: Windows MSI release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-compose, verify-desktop]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Windows MSI
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          .\kotlin-core\gradlew.bat -p compose :desktop-app:packageMsi "-PreleaseVersion=$version" --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: compose/desktop-app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-android, release-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
