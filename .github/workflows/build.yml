name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:

  kotlin-core:
    name: Kotlin core (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('kotlin-core/**/*.gradle*', 'kotlin-core/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission on gradlew
        run: chmod +x gradlew

      - name: Build :core-scanner, :core-fileops, :core-db, :server-ktor
        run: ./gradlew assemble --no-daemon --console=plain

      - name: Run all unit tests
        run: ./gradlew test --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-core-test-reports
          path: |
            kotlin-core/**/build/test-results/test/**/*.xml
            kotlin-core/**/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore