name: Drawer v2

on:
  push:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  verify-compose:
    name: Compose tests and Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Grant Gradle wrapper permission
        run: chmod +x kotlin-core/gradlew
      - name: Test v2 and compile Android debug
        run: ./kotlin-core/gradlew -p compose check :storage-nio:test :storage-saf:assembleDebugAndroidTest :android-app:assembleDebug --no-daemon --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-test-reports
          path: |
            compose/**/build/test-results/**
            compose/**/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore

  verify-desktop:
    name: Windows desktop compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compile desktop client
        shell: pwsh
        run: .\kotlin-core\gradlew.bat -p compose :desktop-app:compileKotlin --no-daemon --console=plain

  release-android:
    name: Signed Android release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-compose, verify-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/drawer-release.jks"
      - name: Build signed Android APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/drawer-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export DRAWER_RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          export DRAWER_RELEASE_VERSION_CODE="$GITHUB_RUN_NUMBER"
          ./kotlin-core/gradlew -p compose :android-app:assembleRelease :android-app:bundleRelease --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: compose/android-app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle
          path: compose/android-app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  release-windows:
    name: Windows MSI release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-compose, verify-desktop]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Windows MSI
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $env:DRAWER_RELEASE_VERSION = $version
          .\kotlin-core\gradlew.bat -p compose :desktop-app:packageMsi --no-daemon --console=plain
          $msi = Get-ChildItem 'compose/desktop-app/build/compose/binaries/main/msi/*.msi' | Select-Object -First 1
          if ($null -eq $msi) { throw 'MSI package was not produced' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Rename-Item -LiteralPath $msi.FullName -NewName "Drawer-v$version-unsigned.msi"
            Write-Host 'Windows signing certificate is not configured; publishing an explicitly unsigned MSI.'
          } else {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
              throw 'WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE_BASE64 is set'
            }
            $certificate = Join-Path $env:RUNNER_TEMP 'drawer-windows-release.pfx'
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
            & $signtool sign /fd SHA256 /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $msi.FullName
            if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed' }
            & $signtool verify /pa $msi.FullName
            if ($LASTEXITCODE -ne 0) { throw 'MSI signature verification failed' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: compose/desktop-app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-android, release-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
